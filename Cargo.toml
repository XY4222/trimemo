[workspace]
members = [
    "crates/trimemo-core",
    "crates/trimemo-py",
    "crates/trimemo-cli",
]
resolver = "2"

[workspace.package]
version = "3.10.0"
edition = "2021"
license = "MIT"
authors = ["trimemo contributors"]
repository = "https://github.com/MemPalace/trimemo"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
